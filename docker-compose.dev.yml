#
# docker-compose LOCAL DEVELOPMENT file
#

services:
  db:
    extends:
       file: docker-compose.base.yml
       service: db
    ports:
      - 5432:5432

  redis:
    extends:
       file: docker-compose.base.yml
       service: redis 
    ports:
      - 6379:6379

  minio:
    extends:
       file: docker-compose.base.yml
       service: minio 
    ports:
      - 9001:9001

  minio_mc:
    extends:
       file: docker-compose.base.yml
       service: minio_mc
    depends_on:
      - minio

  starrocks-fe:
    extends:
       file: docker-compose.base.yml
       service: starrocks-fe 
    depends_on:
      - minio
    ports:
      - 8030:8030
      - 9020:9020
      - 9030:9030
      - 9408:9408

  starrocks-cn:
    extends:
       file: docker-compose.base.yml
       service: starrocks-cn
    depends_on:
      - starrocks-fe

  opensearch:
    extends:
       file: docker-compose.base.yml
       service: opensearch
    ports:
      - 9200:9200
      - 9600:9600

  gravitino:
    extends:
       file: docker-compose.base.yml
       service: gravitino 
    ports:
      - 8090:8090
      - 9002:9001